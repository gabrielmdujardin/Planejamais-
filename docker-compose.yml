services:
  postgres:
    image: postgres:16.4-alpine
    container_name: planeja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-planeja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planeja_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-planeja_plus}
      TZ: America/Sao_Paulo
    ports:
      # Vinculado estritamente ao loopback local (127.0.0.1) para não expor o PostgreSQL à rede externa
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - planeja_pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_init_planeja_plus.sql:/docker-entrypoint-initdb.d/01_init_planeja_plus.sql:ro
      - ./database/migrations/002_rbac_and_collaboration.sql:/docker-entrypoint-initdb.d/02_rbac_and_collaboration.sql:ro
      - ./database/seeds/001_demo_seed.sql:/docker-entrypoint-initdb.d/03_demo_seed.sql:ro
      - ./database/backups:/backups
    networks:
      - planeja-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planeja} -d ${POSTGRES_DB:-planeja_plus}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:v1.21.4
    container_name: planeja-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    volumes:
      - planeja_mailpit:/data
    networks:
      - planeja-internal
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planeja-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-planeja}:${POSTGRES_PASSWORD:-planeja_local_2026}@postgres:5432/${POSTGRES_DB:-planeja_plus}
      DB_PROVIDER: postgresql
      AUTH_SECRET: ${AUTH_SECRET:-planeja-plus-local-jwt-hmac-secret-2026-tcc-key}
      STORAGE_DIR: /app/storage/uploads
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Planeja+ <nao-responda@planeja.local>}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-planeja-cron-secret-local-2026}
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-3000}:3000"
    volumes:
      - planeja_uploads:/app/storage/uploads
    networks:
      - planeja-internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: planeja-pgadmin
    profiles: ["pgadmin", "tools"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@planeja.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-planeja_admin_2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - planeja_pgadmin:/var/lib/pgadmin
    networks:
      - planeja-internal

networks:
  planeja-internal:
    driver: bridge

volumes:
  planeja_pgdata:
    name: planeja_plus_pgdata
  planeja_mailpit:
    name: planeja_plus_mailpit
  planeja_uploads:
    name: planeja_plus_uploads
  planeja_pgadmin:
    name: planeja_plus_pgadmin
